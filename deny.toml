[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Unpublished workspace dependencies use path-only declarations without version requirements.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# The HTTP client and challenge crates retain their original license.
exceptions = [
  { crate = "archivindex-http-client", allow = [
    "GPL-3.0-only",
  ] },
  { crate = "archivindex-http-client-challenge", allow = [
    "GPL-3.0-only",
  ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The observer-enabled wreq fork and its matching TLS crates.
allow-git = ["https://github.com/travisbrown/wreq", "https://github.com/0x676e67/btls"]
