[package]
name = "archivindex-cdx"
description = "Data models for classic CDX, CDXJ, and Wayback Machine CDX JSON"
authors.workspace = true
repository.workspace = true
keywords = ["cdx", "cdxj", "warc", "web", "archive"]
categories = ["encoding"]
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
bounded-static = ["dep:bounded-static"]

[dependencies]
archivindex-serde.workspace = true
bounded-static = { workspace = true, optional = true }
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
archivindex-test-support.workspace = true
proptest.workspace = true
