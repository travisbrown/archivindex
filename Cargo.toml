[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/travisbrown/archivindex"
edition = "2024"
rust-version = "1.88"
readme = "README.md"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
archivindex-cli-support = { path = "crates/cli-support" }
archivindex-serde = { version = "0.1.0", path = "crates/serde" }
archivindex-test-support = { path = "crates/test-support" }
bounded-static = "0.8"
cargo_metadata = "0.23"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
data-encoding = "2"
fluent-uri = "0.4"
indicatif = "0.18"
log = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
simplelog = "0.12"
tempfile = "3"
test-strategy = "0.4"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
url = "2"

# Each entry excuses one package from one rule, and must say why; `cargo archivindex-build check`
# reports an entry that no longer excuses anything.
[[workspace.metadata.archivindex-build.exemptions]]
package = "archivindex-surt"
rule = "dependencies.serde"
reason = "The shared declaration enables `derive`, which is not required here."

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
